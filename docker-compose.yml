# AV Telemetry Pipeline — local dev stack
# Spins up Redpanda (Kafka-compatible broker), Redpanda Console (web UI),
# and MinIO (S3-compatible object store). One command: docker compose up -d
#
# After it's running:
#   - Redpanda broker:    localhost:19092   (use this in your Python client)
#   - Redpanda Console:   http://localhost:8080
#   - MinIO API:          http://localhost:9000
#   - MinIO Console (UI): http://localhost:9001   (login: minioadmin / minioadmin)

services:
  # ---------- Message broker (Kafka-compatible, lightweight) ----------
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: redpanda
    command:
      - redpanda start
      - --smp 1                      # 1 CPU core — fine for local dev
      - --memory 1G                  # cap RAM so it plays nice on a laptop
      - --overprovisioned
      - --node-id 0
      - --check=false
      # Advertise two listeners: one for other containers, one for your host machine
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"   # <-- your Python producer/consumer connects here
      - "9644:9644"     # admin API
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Web UI to watch topics & messages flow ----------
  console:
    image: redpandadata/console:v2.7.2
    container_name: redpanda-console
    depends_on:
      - redpanda
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"     # open http://localhost:8080 in your browser

  # ---------- S3-compatible object store for the lakehouse ----------
  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"     # S3 API endpoint (point boto3 / Spark here)
      - "9001:9001"     # web console: http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- One-shot job: auto-create the 'lakehouse' bucket ----------
  minio-setup:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minioadmin minioadmin) do echo 'waiting for minio...'; sleep 2; done;
      mc mb --ignore-existing local/lakehouse;
      mc mb --ignore-existing local/dead-letter-queue;
      echo 'Buckets ready.';
      exit 0;
      "

volumes:
  minio-data:
